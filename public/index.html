<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải đoạn video YouTube</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; }
    p { color: #555; font-size: 0.9rem; margin-bottom: 24px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      background: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
      margin-bottom: 8px;
    }
    .row .field { min-width: 0; }
    button {
      width: 100%;
      padding: 12px;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    button.secondary {
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #ccc;
    }
    button.secondary:hover:not(:disabled) {
      background: #f5f5f5;
    }
    button.icon {
      width: 40px;
      height: 40px;
      padding: 0;
      font-size: 1.2rem;
      line-height: 1;
      background: #fff;
      color: #666;
      border: 1px solid #ccc;
    }
    button.icon:hover:not(:disabled) {
      background: #fde8e8;
      color: #b00020;
      border-color: #f5c2c2;
    }
    .segments-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0 10px;
    }
    .segments-header label { margin: 0; }
    .segments-header button {
      width: auto;
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    #segments { margin-bottom: 8px; }
    .segment-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }
    .hint { font-size: 0.8rem; color: #777; margin-top: -4px; margin-bottom: 16px; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .status.error { display: block; background: #fde8e8; color: #b00020; }
    .status.loading { display: block; background: #eef4ff; color: #1a4fb0; }
    .status.success { display: block; background: #e8f5e9; color: #1b5e20; }
    #url { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h1>Tải đoạn video YouTube</h1>
  <p>Nhập link video và các phân đoạn cần tải. Nhiều phân đoạn sẽ được tải song song.</p>

  <form id="form">
    <label for="url">Link video YouTube</label>
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required>

    <label for="resolution">Độ phân giải</label>
    <select id="resolution">
      <option value="best">Cao nhất (1080p+)</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
      <option value="360">360p</option>
    </select>

    <div class="segments-header">
      <label>Phân đoạn</label>
      <button type="button" class="secondary" id="addSegmentBtn">+ Thêm phân đoạn</button>
    </div>
    <div id="segments"></div>
    <p class="hint">Định dạng: giây (90) hoặc phút:giây (1:30). Nhiều phân đoạn sẽ được nén thành ZIP.</p>

    <button type="submit" id="submitBtn">Tải video</button>
  </form>

  <div id="status" class="status"></div>

  <script>
    const form = document.getElementById('form');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const segmentsEl = document.getElementById('segments');
    const addSegmentBtn = document.getElementById('addSegmentBtn');

    let segmentCount = 0;

    function setStatus(type, message) {
      statusEl.className = 'status ' + type;
      statusEl.textContent = message;
    }

    function createSegmentRow(start = '', end = '') {
      segmentCount += 1;
      const id = segmentCount;
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.id = id;
      row.innerHTML = `
        <div class="field">
          <div class="segment-label">Phân đoạn ${id} — Bắt đầu</div>
          <input type="text" class="startTime" placeholder="0:30" value="${start}" required>
        </div>
        <div class="field">
          <div class="segment-label">Kết thúc</div>
          <input type="text" class="endTime" placeholder="1:30" value="${end}" required>
        </div>
        <button type="button" class="icon removeBtn" title="Xóa">×</button>
      `;
      row.querySelector('.removeBtn').addEventListener('click', () => {
        if (segmentsEl.children.length <= 1) return;
        row.remove();
        updateSegmentLabels();
      });
      segmentsEl.appendChild(row);
    }

    function updateSegmentLabels() {
      [...segmentsEl.querySelectorAll('.row')].forEach((row, i) => {
        row.querySelector('.segment-label').textContent = `Phân đoạn ${i + 1} — Bắt đầu`;
      });
    }

    function getSegments() {
      return [...segmentsEl.querySelectorAll('.row')].map((row) => ({
        startTime: row.querySelector('.startTime').value.trim(),
        endTime: row.querySelector('.endTime').value.trim(),
      }));
    }

    function saveFile(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    addSegmentBtn.addEventListener('click', () => createSegmentRow());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const segments = getSegments();
      const url = document.getElementById('url').value;

      submitBtn.disabled = true;
      addSegmentBtn.disabled = true;
      setStatus('loading', `Đang tải ${segments.length} phân đoạn song song...`);

      try {
        const res = await fetch('/api/download-batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            segments,
            resolution: document.getElementById('resolution').value,
          }),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error || 'Tải video thất bại');
        }

        const blob = await res.blob();
        const disposition = res.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : 'video.mp4';

        saveFile(blob, filename);
        setStatus('success', `Tải xong! File đã lưu vào Downloads (${filename}).`);
      } catch (err) {
        setStatus('error', err.message);
      } finally {
        submitBtn.disabled = false;
        addSegmentBtn.disabled = false;
      }
    });

    createSegmentRow('0:30', '1:30');
  </script>
</body>
</html>
